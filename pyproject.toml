[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qhc"
version = "0.1.0"
description = "Quantum reservoir features vs matched classical reservoirs for patient-independent heartbeat classification"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "pandas", "wfdb", "scipy", "scikit-learn", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
